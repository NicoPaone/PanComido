name: prueba-ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: BACKEND (.NET)
  # ==========================================
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/api-pan-comido
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Caché de NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          
      - name: Restore & Test
        run: |
          dotnet restore
          dotnet build --no-restore -c Release
          dotnet test --no-build -c Release

  # ==========================================
  # JOB 2: FRONTEND (Angular)
  # ==========================================
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        # IMPORTANTE: Apunta esto a la carpeta donde está tu package.json
        working-directory: ./frontend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm' # Optimización de caché nativa de GitHub
          cache-dependency-path: './frontend/package-lock.json'
          
      - name: Instalar dependencias
        # 'ci' es obligatorio en pipelines: es más rápido y estricto que 'install'
        run: npm ci 
        
      - name: Ejecutar pruebas (Headless)
        run: npm run test:ci


  # ==========================================
  # JOB 3: DEPLOY FRONTEND (Netlify)
  # ==========================================
  deploy-frontend:
    needs: [frontend-tests] # Regla estricta: solo despliega si los tests pasaron
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Producción (ng build)
        run: npm run build

      - name: Desplegar a Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './frontend/dist/frontend/browser'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy Frontend Automático 🚀"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  # ==========================================
  # JOB 4: DEPLOY BACKEND (Azure App Service)
  # ==========================================
  deploy-backend:
    needs: [backend-tests] # Regla estricta: solo despliega si los tests pasaron
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/api-pan-comido
        
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      # Opcional pero recomendado: restaurar caché de NuGet aquí también para ganar velocidad
      - name: Caché de NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}

      - name: Publish API
        # dotnet publish compila y prepara los archivos finales en la carpeta 'publish', osea los compilados
        run: dotnet publish -c Release -o ./publish

      - name: Desplegar a Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'api-pan-comido' # El nombre del App Service en Azure
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './backend/api-pan-comido/publish' # Ruta desde la raíz del repo

